<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <title>Meu Fluxo de Caixa Inteligente</title>
    <style>
        :root {
            --bg-body: #f1f5f9; --bg-container: #ffffff; --texto-principal: #0f172a; --texto-secundario: #64748b;
            --borda: #e2e8f0; --espessura-borda: 1px; --shadow: 0 1px 3px rgba(0,0,0,0.05);
            --radius: 12px; --entrada: #10b981; --saida: #ef4444; --cartao: #f59e0b;
            --reserva-cor: #06b6d4; --header-bg: #2563eb; --header-txt: #ffffff; --saldo-box-bg: #ffffff;
        }
    body.theme-escuro { --bg-body: #0f172a; --bg-container: #1e293b; --texto-principal: #f8fafc; --texto-secundario: #94a3b8; --borda: #334155; --header-bg: #1e293b; --header-txt: #3b82f6; --saldo-box-bg: #1e293b; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-body); color: var(--texto-principal); padding: 16px 16px 95px 16px; display: flex; flex-direction: column; align-items: center; }
  .container { width: 100%; max-width: 500px; }
  .app-header { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 16px; padding: 12px; background: var(--header-bg); border-radius: var(--radius); }
  .app-title { font-size: 1.3rem; font-weight: 700; color: var(--header-txt); }
  .icon-btn { background: transparent; border: none; font-size: 1.2rem; cursor: pointer; color: var(--header-txt); width: 38px; height: 38px; }
  .app-view { display: none; width: 100%; }
  .app-view.ativa { display: flex; flex-direction: column; }
  .cards-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
  .card { background: var(--bg-container); padding: 16px 8px; text-align: center; border-radius: var(--radius); border: var(--espessura-borda) solid var(--borda); }
  .card h3 { font-size: 0.8rem; color: var(--texto-secundario); margin-bottom: 6px; font-weight: bold; text-transform: uppercase; }
  .card p { font-size: 1.1rem; font-weight: 700; }
  .card.saldo-total { grid-column: span 2; padding: 24px; background: var(--saldo-box-bg); }
  .card.saldo-total h3 { font-size: 0.85rem; color: var(--texto-secundario); }
  .card.saldo-total p { font-size: 2.2rem; font-weight: 700; }

  .info-subtil-container { display: flex; justify-content: center; width: 100%; margin-top: 12px; border-top: 1px solid rgba(0,0,0,0.05); padding-top: 16px; } /* SÓ MEDIA/DIA */
  .previsao-texto { font-size: 0.85rem; color: var(--texto-secundario); font-weight: normal; }
  .previsao-texto strong { font-weight: 700; color: var(--texto-principal); }

  .cor-entrada { color: var(--entrada); }
  .cor-saida { color: var(--saida); }
  .cor-cartao { color: var(--cartao); }
  .cor-reserva { color: var(--reserva-cor); }
  .filtros-container { display: flex; gap: 10px; margin-bottom: 20px; width: 100%; }
  .filtro-select { flex: 1; padding: 12px; border-radius: var(--radius); border: var(--espessura-borda) solid var(--borda); background: var(--bg-container); }
  .secao-conteudo { background: var(--bg-container); padding: 20px; border-radius: var(--radius); border: var(--espessura-borda) solid var(--borda); margin-bottom: 20px; }
  .chat-input-area { display: flex; gap: 8px; background: var(--bg-container); padding: 6px 6px 6px 16px; border-radius: 24px; border: var(--espessura-borda) solid var(--borda); }
  .chat-input { flex-grow: 1; border: none; background: transparent; color: var(--texto-principal); outline: none; }
  .btn-enviar { background: var(--header-bg); color: var(--header-txt); border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }
  .alerta-temporario { position: absolute; top: -54px; left: 50%; transform: translateX(-50%); background: #111b21; color: #ffffff; padding: 8px 20px; border-radius: 20px; opacity: 0; transition: 0.2s; }
  .alerta-temporario.mostrar { opacity: 1; }
  .menu-rodape-wrapper { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 500px; background: var(--bg-container); padding: 10px 16px; border-top: var(--espessura-borda) solid var(--borda); }
  .menu-rodape { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .tab-item { display: flex; flex-direction: column; align-items: center; gap: 4px; background: transparent; border: none; color: var(--texto-secundario); font-size: 0.75rem; }
  .tab-item.ativo { color: var(--header-bg); }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; }
  .modal-container { background: var(--bg-container); width: 90%; max-width: 400px; border-radius: var(--radius); padding: 24px; }
  .item-transacao { display: flex; flex-direction: column; padding: 10px 5px; border-bottom: 1px solid var(--borda); gap: 6px; }
  .linha-1 { display: flex; justify-content: space-between; }
  .descricao { font-size: 0.95rem; font-weight: 600; }
  .valor { font-size: 0.95rem; font-weight: 700; }
</style>
</head>
<body>

<div class="container">
<div class="app-header">
    <div class="app-title" id="titulo-dinamico">Meu Saldo</div>
    <div class="app-actions">
        <button class="icon-btn" id="btn-visibilidade" onclick="alternarVisibilidade()">🔓</button>
        <button class="icon-btn" onclick="alternarTema()">🫟</button>
    </div>
</div>

<div class="app-view ativa" id="view-inicio">
    <div class="cards-container">
        <div class="card"><h3>entradas</h3><p class="cor-entrada">R$ <span class="valor-dinamico" id="card-entradas" data-valor="0.00">0,00</span></p></div>
        <div class="card"><h3>saídas</h3><p class="cor-saida">R$ <span class="valor-dinamico" id="card-saidas" data-valor="0.00">0,00</span></p></div>
        <div class="card"><h3>cartão</h3><p class="cor-cartao">R$ <span class="valor-dinamico" id="card-cartao" data-valor="0.00">0,00</span></p></div>
        <div class="card"><h3>reserva</h3><p class="cor-reserva">R$ <span class="valor-dinamico" id="card-reserva" data-valor="0.00">0,00</span></p></div>
        <div class="card saldo-total">
            <h3>Saldo Atual</h3>
            <p id="card-saldo" class="valor-dinamico" data-valor="0.00">R$ 0,00</p>
            <div class="info-subtil-container"> <!-- SÓ SOBROU A MEDIA -->
                <div class="previsao-texto"><strong>Média/Dia:</strong> <span class="valor-dinamico" id="previsao-valor" data-valor="0.00">R$ 0,00</span></div>
            </div>
        </div>
    </div>

    <div class="chat-input-area">
        <div id="alerta" class="alerta-temporario">Salvo! 📁</div>
        <input type="text" id="campo-texto" class="chat-input" placeholder="Ex: reserva 200 ou gasolina 50" onkeypress="verificarTecla(event)">
        <button class="btn-enviar" onclick="processarComando()">➔</button>
    </div>
</div>

<div class="app-view" id="view-historico">
    <div class="filtros-container">
        <select id="filtro-mes" class="filtro-select" onchange="atualizarAplicativo()"></select>
        <select id="filtro-tipo" class="filtro-select" onchange="atualizarAplicativo()">
            <option value="todos">Todos</option><option value="entrada">Entradas</option>
            <option value="saida">Saídas</option><option value="cartao">Cartão</option>
            <option value="reserva">Reserva</option>
        </select>
    </div>
    <div class="secao-conteudo" id="lista-transacoes-container"></div>
</div>

<div class="app-view" id="view-graficos"><div class="secao-conteudo"><h4>Gráficos em breve</h4></div></div>
<div class="app-view" id="view-config"><div class="secao-conteudo"><button onclick="resetarAplicativoTotal()">🗑️ Limpar Tudo</button></div></div>

<div class="menu-rodape-wrapper">
    <div class="menu-rodape">
        <button class="tab-item ativo" id="tab-inicio" onclick="navegarPara('inicio')"><span>💬</span><span>Conversa</span></button>
        <button class="tab-item" id="tab-historico" onclick="navegarPara('historico')"><span>📝</span><span>Histórico</span></button>
        <button class="tab-item" id="tab-graficos" onclick="navegarPara('graficos')"><span>📊</span><span>Status</span></button>
        <button class="tab-item" id="tab-config" onclick="navegarPara('config')"><span>⚙️</span><span>Config</span></button>
    </div>
</div>
</div>

<div class="modal-overlay" id="modal-edicao">
    <div class="modal-container">
        <div>Editar</div>
        <input type="text" id="modal-desc"><input type="number" id="modal-valor">
        <select id="modal-tipo"><option value="entrada">Entrada</option><option value="saida">Saída</option><option value="cartao">Cartão</option><option value="reserva">Reserva</option></select>
        <button onclick="acaoSalvar()">Salvar</button><button onclick="fecharModal()">Cancelar</button>
    </div>
</div>

<script>
    let transacoes = [], idEdicaoAtual = null, saldosOcultos = false;
    let temasDisponiveis = ['padrao', 'escuro']; let temaAtualIndex = 0;
    const nomesMeses = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
    const obterId = id => document.getElementById(id);

    function navegarPara(idAba) {
        document.querySelectorAll('.app-view').forEach(v => v.classList.remove('ativa'));
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('ativo'));
        obterId(`view-${idAba}`).classList.add('ativa'); obterId(`tab-${idAba}`).classList.add('ativo');
        atualizarAplicativo();
    }

    function inicializarFiltroMeses() {
        const hoje = new Date(), f = obterId('filtro-mes');
        let html = `<option value="${hoje.getMonth()}-${hoje.getFullYear()}">Mês Atual</option><option value="todos">Todos</option>`;
        f.innerHTML = html;
    }

    function processarComando() {
        const input = obterId('campo-texto'), txt = input.value.trim().toLowerCase();
        const num = txt.match(/\d+([.,]\d+)?/g); if (!num) return;
        const valor = parseFloat(num[0].replace(',', '.'));
        let tipo = 'saida';
        if (/\b(reserva|guardar)\b/.test(txt)) tipo = 'reserva';
        else if (/\b(cartao|cartão)\b/.test(txt)) tipo = 'cartao';
        else if (/\b(recebi|ganhei|salario)\b/.test(txt)) tipo = 'entrada';
        let desc = input.value.replace(num[0], '').trim() || "Lançamento";
        let hoje = new Date();
        transacoes.unshift({ id: Date.now(), descricao: desc, valor: valor, tipo, mes: hoje.getMonth(), ano: hoje.getFullYear(), dia: hoje.getDate() });
        localStorage.setItem('saldo_transacoes', JSON.stringify(transacoes));
        atualizarAplicativo(); input.value = '';
    }

    function atualizarAplicativo() {
        let ent = 0, sai = 0, car = 0, res = 0;
        transacoes.forEach(t => {
            if(t.tipo === 'entrada') ent += t.valor;
            else if(t.tipo === 'saida') sai += t.valor;
            else if(t.tipo === 'cartao') car += t.valor;
            else if(t.tipo === 'reserva') res += t.valor;
        });
        const saldo = ent - sai - car - res; const gastos = sai + car;

        obterId('card-entradas').setAttribute('data-valor', ent.toFixed(2));
        obterId('card-saidas').setAttribute('data-valor', sai.toFixed(2));
        obterId('card-cartao').setAttribute('data-valor', car.toFixed(2));
        obterId('card-reserva').setAttribute('data-valor', res.toFixed(2));
        obterId('card-saldo').setAttribute('data-valor', saldo.toFixed(2));
        obterId('previsao-valor').setAttribute('data-valor', (gastos / 30).toFixed(2)); // SÓ MEDIA/DIA

        document.querySelectorAll('.valor-dinamico').forEach(el => {
            const v = parseFloat(el.getAttribute('data-valor')).toLocaleString('pt-BR', { minimumFractionDigits: 2 });
            el.innerText = saldosOcultos? "R$ ••••" : `R$ ${v}`;
        });
        renderizarHistorico();
    }

    function renderizarHistorico() {
        const l = obterId('lista-transacoes-container'); l.innerHTML = '';
        transacoes.forEach(t => {
            let cls = t.tipo === 'entrada'? 'cor-entrada' : t.tipo === 'cartao'? 'cor-cartao' : t.tipo === 'reserva'? 'cor-reserva' : 'cor-saida';
            let item = document.createElement('div'); item.className = `item-transacao`;
            item.innerHTML = `<div class="linha-1"><span class="descricao">${t.descricao}</span><span class="valor ${cls}">${t.tipo === 'entrada'? '+' : '-'} R$ ${t.valor.toFixed(2)}</span></div>`;
            l.appendChild(item);
        });
    }

    function alternarVisibilidade() { saldosOcultos =!saldosOcultos; atualizarAplicativo(); }
    function verificarTecla(e) { if (e.key === 'Enter') processarComando(); }
    function acaoSalvar() { fecharModal(); localStorage.setItem('saldo_transacoes', JSON.stringify(transacoes)); atualizarAplicativo(); }
    function fecharModal() { obterId('modal-edicao').style.display = 'none'; }
    function resetarAplicativoTotal() { if (confirm("Limpar tudo?")) { transacoes = []; localStorage.setItem('saldo_transacoes', '[]'); atualizarAplicativo(); } }

    window.onload = () => {
        const s = localStorage.getItem('saldo_transacoes'); if (s) transacoes = JSON.parse(s);
        inicializarFiltroMeses(); atualizarAplicativo();
    };
</script>
</body>
</html>
