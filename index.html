<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Estilos Base */
        body { font-family: sans-serif; margin: 0; padding: 20px; background: #fffdf5; }
        
        /* Cabeçalho Alinhado */
        .app-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #2b2b2b; 
            color: white; 
            padding: 15px; 
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .app-title { font-size: 1.2rem; font-weight: bold; }
        .app-actions { display: flex; gap: 15px; }
        
        .icon-btn { 
            background: transparent; 
            border: none; 
            cursor: pointer; 
            font-size: 1.4rem; 
        }

        /* Área de Conteúdo */
        .card { border: 2px solid #000; padding: 15px; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="app-title">Histórico</div>
        <div class="app-actions">
            <button class="icon-btn" id="btn-visibilidade" onclick="alternarVisibilidade()">👁</button>
            <button class="icon-btn" onclick="alternarTema()">🎨</button>
        </div>
    </div>

    <div class="card" id="lista-movimentacoes">
        <!-- Seus itens de movimentação virão aqui -->
    </div>

    <script>
        let saldosOcultos = false;
        let temaAtualIndex = 0;
        const temas = ['padrao', 'escuro', 'pastel'];

        // Função de Visibilidade
        function alternarVisibilidade() {
            saldosOcultos = !saldosOcultos;
            const btn = document.getElementById('btn-visibilidade');
            btn.innerText = saldosOcultos ? "👁️‍🗨️" : "👁";
            atualizarAplicativo();
        }

        // Função de Tema
        function alternarTema() {
            temaAtualIndex = (temaAtualIndex + 1) % temas.length;
            document.body.className = 'theme-' + temas[temaAtualIndex];
        }

        // Função principal que redesenha a tela
        function atualizarAplicativo() {
            // Exemplo de lógica para esconder valores
            const elementosValor = document.querySelectorAll('.valor');
            elementosValor.forEach(el => {
                el.innerText = saldosOcultos ? "R$ ---" : el.dataset.valorOriginal;
            });
        }
    </script>
</body>
</html>
