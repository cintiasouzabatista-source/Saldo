<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meu Fluxo de Caixa Inteligente</title>
    <style>
        /* [ ... MANTIVE AS VARIÁVEIS DE TEMA IGUAIS ...] */
        :root {
            --bg-body: #f4f4f9;
            --bg-container: #ffffff; 
            --texto-principal: #111827;
            --texto-secundario: #6b7280;
            --borda: #111827;
            --espessura-borda: 2px;
            --shadow: 4px 4px 0px #111827;
            --radius: 16px;
            --entrada: #10b981;
            --saida: #ff4a5a;
            --cartao: #ffb800;
            --reserva-cor: #6366f1;
            --chat-verde: #6366f1; 
            --bg-rodape: rgba(255, 255, 255, 0.9);
        }

        /* [ ... TEMAS ... ] */
        [data-theme="pastel"] { --bg-body: #fdf6ec; --texto-principal: #4a3e3d; --borda: #e8dcd8; --shadow: 0 8px 20px rgba(140, 126, 125, 0.1); }
        [data-theme="retro"] { --bg-body: #f4eae1; --texto-principal: #432c1d; --borda: #432c1d; --shadow: 4px 4px 0px #d4a373; }
        [data-theme="contemporaneo"] { --bg-body: #f8fafc; --texto-principal: #0f172a; --borda: #cbd5e1; --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Space Grotesk', sans-serif; }
        
        /* MUDANÇA: O body agora permite scroll natural */
        body { background-color: var(--bg-body); color: var(--texto-principal); padding: 16px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        /* MUDANÇA: Container com altura automática para crescer com o conteúdo */
        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; min-height: 100vh; position: relative; }
        
        .app-header { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 20px; padding: 4px; }
        .app-title { font-size: 1.6rem; font-weight: 900; color: var(--texto-principal); letter-spacing: -1px; text-transform: lowercase; }
        
        /* MUDANÇA: Views não possuem mais altura fixa */
        .app-view { display: none; width: 100%; flex-direction: column; }
        .app-view.ativa { display: flex; }

        .cards-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
        .card { background: var(--bg-container); padding: 16px 8px; text-align: center; border-radius: var(--radius); border: var(--espessura-borda) solid var(--borda); box-shadow: var(--shadow); }
        
        /* MUDANÇA: Footer agora flui no documento (não é fixo) */
        .menu-rodape-wrapper { margin-top: auto; padding: 20px 0; }
        .menu-rodape { display: flex; overflow-x: auto; scroll-behavior: smooth; gap: 12px; padding: 2px; }
        .menu-rodape::-webkit-scrollbar { display: none; }
        
        .tab-item { background: var(--bg-container); border: var(--espessura-borda) solid var(--borda); color: var(--texto-principal); padding: 10px 22px; border-radius: var(--radius); cursor: pointer; font-weight: 900; white-space: nowrap; flex-shrink: 0; box-shadow: var(--shadow); transition: all 0.1s ease; }
        .tab-item.ativo { color: #ffffff; background: var(--texto-principal); box-shadow: none; transform: translate(2px, 2px); }

        /* [ ... RESTANTE DO CSS MANTIDO (Modais, Chat, etc) ... ] */
        .chat-container-dinamico { margin-top: 20px; margin-bottom: 20px; width: 100%; }
        .chat-input-area { display: flex; gap: 8px; background: var(--chat-verde); padding: 10px 18px; border-radius: var(--radius); border: var(--espessura-borda) solid var(--borda); align-items: center; box-shadow: var(--shadow); }
        .chat-input { flex-grow: 1; border: none; padding: 8px 0; font-size: 1rem; outline: none; background: transparent; color: #ffffff; font-weight: bold; }
        .btn-enviar { background: var(--bg-container); color: var(--texto-principal); border: var(--espessura-borda) solid var(--borda); width: 42px; height: 42px; border-radius: var(--radius); cursor: pointer; box-shadow: 2px 2px 0 var(--borda); }
        
        /* [ ... O RESTO É IGUAL AO CÓDIGO ANTERIOR ... ] */
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
    
    <div class="app-header">
        <div class="app-title" id="titulo-dinamico">meu saldo</div>
    </div>

    <!-- TELA 1 -->
    <div class="app-view ativa" id="view-inicio">
        <!-- [ ... Conteúdo dos cards ... ] -->
        <div class="cards-container">
           <!-- (Mantido igual) -->
        </div>

        <div class="chat-container-dinamico">
            <!-- (Mantido igual) -->
        </div>
    </div>

    <!-- TELA 2 -->
    <div class="app-view" id="view-historico">
       <!-- (Mantido igual) -->
    </div>

    <!-- MENU INSERIDO NO FLUXO (NÃO MAIS FIXO) -->
    <div class="menu-rodape-wrapper">
        <div class="menu-rodape">
            <button class="tab-item ativo" id="tab-inicio" onclick="navegarPara('inicio')">🏠 Início</button>
            <button class="tab-item" id="tab-historico" onclick="navegarPara('historico')">📝 Histórico</button>
            <button class="tab-item" id="tab-graficos" onclick="navegarPara('graficos')">📊 Análises</button>
            <button class="tab-item" id="tab-config" onclick="navegarPara('config')">⚙️ Ajustes</button>
        </div>
    </div>

</div>

<!-- [ ... SCRIPT MANTIDO IGUAL ... ] -->
<script>
    // A função navegarPara continua funcionando, apenas não controla scroll fixed.
    function navegarPara(idAba) {
        document.querySelectorAll('.app-view').forEach(v => v.classList.remove('ativa'));
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('ativo'));
        document.getElementById(`view-${idAba}`).classList.add('ativa');
        document.getElementById(`tab-${idAba}`).classList.add('ativo');
        
        // Scroll suave para o topo da página ao mudar de aba
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>

</body>
</html>
